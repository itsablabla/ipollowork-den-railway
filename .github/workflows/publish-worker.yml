name: publish-worker-image

on:
  push:
    branches: [main]
    paths: ["services/worker/**", "versions.json", ".github/workflows/publish-worker.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          echo "server=$(jq -r .openwork_server versions.json)" >> "$GITHUB_OUTPUT"
          echo "opencode=$(jq -r .opencode versions.json)" >> "$GITHUB_OUTPUT"
          echo "image=$(jq -r .worker_image versions.json)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: services/worker
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            OPENWORK_SERVER_VERSION=${{ steps.v.outputs.server }}
            OPENCODE_VERSION=${{ steps.v.outputs.opencode }}
          tags: |
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.server }}
            ${{ steps.v.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=OpenWork/iPolloWork hosted worker (openwork-server + OpenCode)
            org.opencontainers.image.licenses=MIT
      - name: Smoke test
        run: |
          docker run --rm --entrypoint sh ${{ steps.v.outputs.image }}:${{ steps.v.outputs.server }} -c 'openwork-server --version && opencode --version && ls /opt/openwork/opencode-plugins'
