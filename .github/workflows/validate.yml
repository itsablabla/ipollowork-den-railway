name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  config:
    name: Lint configs, scripts, and template JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate template and verify it is committed
        run: |
          python3 scripts/generate-template.py
          git diff --exit-code -- template/ || (echo "template/ is stale; run scripts/generate-template.py" && exit 1)
      - name: Validate railway.json files against the Railway schema
        run: |
          curl -fsSL https://railway.com/railway.schema.json -o /tmp/railway.schema.json
          npx --yes ajv-cli@5 validate --spec=draft2020 -s /tmp/railway.schema.json -d "services/*/railway.json" --strict=false
      - name: Shell syntax + shellcheck
        run: |
          for f in services/*/entrypoint.sh scripts/*.sh; do sh -n "$f"; done
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning services/*/entrypoint.sh scripts/*.sh
      - name: Node script syntax + dry run
        run: |
          node --check scripts/railway-provision.mjs
          node scripts/railway-provision.mjs --dry-run --owner-email ci@example.com --template template/railway-template.json
      - name: Compose file validates
        run: |
          cp .env.example .env
          sed -i 's/^MYSQL_ROOT_PASSWORD=$/MYSQL_ROOT_PASSWORD=ci-password/; s/^BETTER_AUTH_SECRET=$/BETTER_AUTH_SECRET=0123456789abcdef0123456789abcdef/; s/^DEN_DB_ENCRYPTION_KEY=$/DEN_DB_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef/; s/^DEN_OWNER_EMAIL=.*/DEN_OWNER_EMAIL=ci@example.com/' .env
          docker compose config -q

  images:
    name: Build ${{ matrix.service }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [mysql, den-api, den-web, worker, inference]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: false
          load: true
          tags: ipollowork-den/${{ matrix.service }}:ci
      - name: Gate routing unit checks
        if: matrix.service == 'worker'
        run: node services/worker/tests/gate-routing.test.mjs && node --check services/worker/web-gate.mjs
      - name: Smoke (worker binaries present)
        if: matrix.service == 'worker'
        run: |
          docker run --rm --entrypoint sh ipollowork-den/worker:ci -c 'ipollowork-server --version && opencode --version && ls /opt/ipollowork/apps/server/dist/opencode-plugins/*.js && test -f /opt/ipollowork/apps/app/dist/index.html'

  stack:
    name: Boot the full stack with docker compose
    runs-on: ubuntu-latest
    needs: [config]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare env
        run: |
          cp .env.example .env
          sed -i "s/^MYSQL_ROOT_PASSWORD=$/MYSQL_ROOT_PASSWORD=$(openssl rand -hex 16)/; s/^BETTER_AUTH_SECRET=$/BETTER_AUTH_SECRET=$(openssl rand -hex 32)/; s/^DEN_DB_ENCRYPTION_KEY=$/DEN_DB_ENCRYPTION_KEY=$(openssl rand -hex 32)/; s/^DEN_OWNER_EMAIL=.*/DEN_OWNER_EMAIL=ci@example.com/" .env
      - name: Up
        run: docker compose up -d --build --wait --wait-timeout 600
      - name: Probe
        run: |
          curl -fsS http://127.0.0.1:8788/health
          curl -fsS http://127.0.0.1:3005/api/health
          curl -fsS http://127.0.0.1:3005/api/runtime-config || true
          curl -fsS http://127.0.0.1:8787/health || (echo "worker health failed"; docker compose logs worker; exit 1)
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -300
      - name: Down
        if: always()
        run: docker compose down -v
